<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>ระบบเจ้าหน้าที่ - สแกนแลกของรางวัล</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- html5-qrcode SDK สำหรับสแกน QR Code จากกล้อง -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            background-color: #f4f7f6;
        }
        .staff-header-bg {
            height: 160px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: -1;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.2);
        }
        .staff-header-content {
            text-align: center;
            padding-top: 20px;
            margin-bottom: 20px;
        }
        .staff-title {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .staff-subtitle {
            color: #d1e1ff;
            margin: 5px 0 0 0;
            font-size: 13px;
            font-weight: 400;
        }
        .scanner-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            margin: 0 15px;
        }
        .scanner-wrapper {
            border: 3px dashed #2a5298;
            border-radius: 16px;
            padding: 5px;
            background: #f8faff;
        }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
        }

        /* การ์ดแสดงผลสถานะขนาดใหญ่ */
        .result-card {
            display: none;
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .result-icon {
            font-size: 54px;
            margin-bottom: 12px;
        }
        .result-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .result-detail {
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* ปุ่มกดเพื่อสแกนคนถัดไป */
        .btn-scan-next {
            display: none;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 60, 114, 0.3);
            transition: transform 0.1s ease;
        }
        .btn-scan-next:active {
            transform: scale(0.98);
        }

        /* Animation วงกลมหมุนรอผล */
        .big-spinner {
            width: 45px;
            height: 45px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #1e3c72;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-text {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container" style="position: relative; z-index: 1; padding-top: 10px;">
        <div class="staff-header-bg"></div>

        <div class="content" style="padding-bottom: 80px;">
            <div class="staff-header-content">
                <h2 class="staff-title">STAFF SCANNER</h2>
                <h4 class="staff-subtitle">สแกน QR Code เพื่อยืนยันการจ่ายรางวัล</h4>
            </div>

            <div class="scanner-card">
                <!-- กล้องสแกน -->
                <div id="scannerContainer" class="scanner-wrapper">
                    <div id="reader"></div>
                </div>

                <!-- การ์ดสถานะขนาดใหญ่ (จะโชว์เมื่อสแกนติด) -->
                <div id="resultCard" class="result-card">
                    <div id="resultIcon" class="result-icon"></div>
                    <div id="resultTitle" class="result-title"></div>
                    <div id="resultDetail" class="result-detail"></div>
                </div>

                <!-- ปุ่มเปิดสแกนคนถัดไป -->
                <button id="btnScanNext" class="btn-scan-next" onclick="startScanner()">📷 สแกนคนถัดไป</button>
            </div>
        </div>

        <div class="footer-text">
            © 2026 Akarawin Chaorungmatee.<br>All rights reserved.
        </div>
    </div>

    <script src="staff.js"></script>
</body>
</html>
