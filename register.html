<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>ลงทะเบียน Open House</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

    <div class="app-container">
        <div class="header-bg"></div>

        <div class="content">
             <h2>🎪 OPEN HOUSE 2024</h2>
            <div id="loading">
                <div class="loader-box">
                    <div class="loader-circle"></div>
                    <div class="loader-circle"></div>
                </div>
                <div class="loading-text">กำลังค้นหาข้อมูล</div>
            </div>

            <!-- ฟอร์มลงทะเบียน -->
            <div id="registerSection">
                <h3>ลงทะเบียนเข้าร่วมงาน</h3>

                <div class="input-group">
                    <label>คำนำหน้าชื่อ</label>
                    <select id="prefix">
                        <option value="" disabled selected>เลือกคำนำหน้า</option>
                        <option value="เด็กชาย">เด็กชาย</option>
                        <option value="เด็กหญิง">เด็กหญิง</option>
                        <option value="นาย">นาย</option>
                        <option value="นาง">นาง</option>
                        <option value="นางสาว">นางสาว</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>ชื่อ - นามสกุล</label>
                    <input type="text" id="name" placeholder="ไม่ต้องใส่คำนำหน้า">
                </div>

                <div class="input-group">
                    <label>โรงเรียนที่กำลังศึกษา</label>
                    <input type="text" id="school" placeholder="ระบุชื่อโรงเรียน">
                </div>

                <div class="input-group">
                    <label>ระดับชั้น</label>
                    <select id="level">
                        <option value="" disabled selected>เลือกระดับชั้น</option>
                        <option value="ประถม">ประถม</option>
                        <option value="มัธยมต้น">มัธยมต้น</option>
                        <option value="มัธยมปลาย">มัธยมปลาย</option>
                        <option value="ประกาศนียบัตรวิชาชีพ (ปวช.)">ประกาศนียบัตรวิชาชีพ (ปวช.)</option>
                        <option value="ประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.)">ประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.)</option>
                        <option value="อนุปริญญา">อนุปริญญา</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>เบอร์โทรศัพท์ <span style="color: #888; font-weight: normal;">(ไม่บังคับ)</span></label>
                    <input type="tel" id="phone" placeholder="08XXXXXXXX" maxlength="10" inputmode="numeric">
                </div>

                <div class="input-group">
                    <label>อีเมล <span style="color: #888; font-weight: normal;">(ไม่บังคับ)</span></label>
                    <input type="email" id="email" placeholder="example@email.com">
                </div>

                <button id="btnRegister" onclick="register()">ยืนยันการลงทะเบียน</button>
            </div>

            <!-- บัตรประจำตัวผู้เข้าร่วมงาน (Profile) -->
            <div id="profileSection">
                <div class="profile-card">
                    <img id="linePic" class="profile-pic" src="https://via.placeholder.com/150" alt="Profile">
                    <div>
                        <div class="status-badge">✅ ลงทะเบียนแล้ว</div>
                    </div>

                    <div class="info-row">
                        <span class="info-label">ชื่อ-สกุล:</span>
                        <span class="info-value" id="profileName">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">โรงเรียน:</span>
                        <span class="info-value" id="profileSchool">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">ระดับชั้น:</span>
                        <span class="info-value" id="profileLevel">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">เบอร์โทรศัพท์:</span>
                        <span class="info-value" id="profilePhone">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">อีเมล:</span>
                        <span class="info-value" id="profileEmail">-</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const LIFF_ID = "2012346461-aXrfKbyZ";
        // อย่าลืมอัปเดต GAS_URL ให้เป็นเวอร์ชันล่าสุดด้วยนะครับ
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz30XwcioTpPSuMYZyUF3X1jtImjG7LabmdFMpkkcfB5HFk-c-cfXb4js_3FIvccGgbhw/exec";

        let userId = "";
        let pictureUrl = "";

        // ตั้งค่าข้อความในโปรไฟล์ (ถ้าค่าว่างให้แสดง "-")
        function setText(id, value) {
            const el = document.getElementById(id);
            if (el) el.innerText = value || "-";
        }

        function showProfile(d) {
            document.getElementById("registerSection").style.display = "none";
            document.getElementById("profileSection").style.display = "block";
            setText("profileName", (d.prefix || "") + (d.name || ""));
            setText("profileSchool", d.school);
            setText("profileLevel", d.level);
            setText("profilePhone", d.phone);
            setText("profileEmail", d.email);
        }

        document.getElementById("loading").style.display = "block";

        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    userId = profile.userId;
                    pictureUrl = profile.pictureUrl || "https://via.placeholder.com/150";
                    document.getElementById("linePic").src = pictureUrl;

                    checkUserStatus(userId);
                });
            } else {
                liff.login();
            }
        }).catch(err => {
            document.getElementById("loading").style.display = "none";
            alert("เริ่มต้น LIFF ไม่สำเร็จ: " + err.message);
        });

        function checkUserStatus(uid) {
            fetch(GAS_URL + "?action=checkUser&userId=" + encodeURIComponent(uid), {
                method: 'GET',
                redirect: 'follow'
            })
                .then(response => response.text())
                .then(text => {
                    document.getElementById("loading").style.display = "none";
                    try {
                        const data = JSON.parse(text);
                        if (data.status === "found") {
                            showProfile(data);
                        } else {
                            document.getElementById("registerSection").style.display = "block";
                        }
                    } catch (e) {
                        console.error(e);
                        alert("เกิดข้อผิดพลาดในการโหลดข้อมูล");
                        document.getElementById("registerSection").style.display = "block";
                    }
                })
                .catch(error => {
                    alert("เชื่อมต่อฐานข้อมูลล้มเหลว");
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("registerSection").style.display = "block";
                });
        }

        function register() {
            const prefix = document.getElementById("prefix").value;
            const name = document.getElementById("name").value.trim();
            const school = document.getElementById("school").value.trim();
            const level = document.getElementById("level").value;
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("btnRegister");

            // ช่องบังคับ
            if (!prefix || !name || !school || !level) {
                alert("กรุณากรอกข้อมูลที่จำเป็น (คำนำหน้า, ชื่อ-สกุล, โรงเรียน, ระดับชั้น) ให้ครบถ้วน");
                return;
            }

            // ตรวจรูปแบบเฉพาะกรณีที่กรอกมา
            if (phone && !/^0\d{9}$/.test(phone)) {
                alert("กรุณากรอกเบอร์โทรศัพท์ 10 หลัก ขึ้นต้นด้วย 0");
                return;
            }
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("รูปแบบอีเมลไม่ถูกต้อง");
                return;
            }

            btn.innerText = "กำลังบันทึก...";
            btn.disabled = true;

            const payload = {
                action: "register",
                userId: userId,
                prefix: prefix,
                name: name,
                school: school,
                level: level,
                phone: phone || "-",
                email: email || "-"
            };

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
                .then(() => {
                    showProfile({
                        prefix: prefix,
                        name: name,
                        school: school,
                        level: level,
                        phone: phone,
                        email: email
                    });
                }).catch((error) => {
                    alert("เกิดข้อผิดพลาดตอนบันทึก: " + error.message);
                    btn.innerText = "ยืนยันการลงทะเบียน";
                    btn.disabled = false;
                });
        }
    </script>

</body>

</html>
