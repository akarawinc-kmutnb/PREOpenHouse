<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        #loading, #registerSection, #profileSection { display: none; }
        .profile-card { background: #e8f5e9; padding: 20px; border-radius: 10px; margin-top: 20px; }
        input { padding: 10px; width: 80%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #00B900; color: white; border: none; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>Open House</h2>

    <!-- หน้าโหลดตอนเปิดแอป (ระบบกำลังแอบเช็คข้อมูลให้) -->
    <div id="loading">กำลังตรวจสอบข้อมูล... ⏳</div>

    <!-- ฟอร์มลงทะเบียน (แสดงเฉพาะคนใหม่ที่ยังไม่เคยลงเท่านั้น) -->
    <div id="registerSection">
        <h3>กรุณาลงทะเบียนเข้างาน</h3>
        <input type="text" id="name" placeholder="ชื่อ-สกุล"><br>
        <input type="text" id="school" placeholder="โรงเรียน"><br><br>
        <button id="btnRegister" onclick="register()">ลงทะเบียน</button>
    </div>

    <!-- หน้าโปรไฟล์ (เปิดมาเจอหน้านี้ทันทีถ้าเคยลงทะเบียนแล้ว) -->
    <div id="profileSection">
        <div class="profile-card">
            <h3 style="color: #2e7d32;">✅ คุณลงทะเบียนเรียบร้อยแล้ว</h3>
            <p><strong>ชื่อ:</strong> <span id="profileName"></span></p>
            <p><strong>โรงเรียน:</strong> <span id="profileSchool"></span></p>
        </div>
    </div>

    <script>
        const LIFF_ID = "2012346461-aXrfKbyZ"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwnyByZ17L_OssplbmKuzKo1nbWvTfaqEs_sKBvp5FlVvpLuD3gNWDwqPh6rZMSxMVSiA/exec";
        let userId = "";

        document.getElementById("loading").style.display = "block";

        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(profile => { 
                    userId = profile.userId; 
                    checkUserStatus(userId); 
                });
            } else {
                liff.login();
            }
        });

        // อัปเดตฟังก์ชันเช็คสถานะให้แสดง Error ที่แท้จริง
        function checkUserStatus(uid) {
            fetch(GAS_URL + "?action=checkUser&userId=" + uid, {
                method: 'GET',
                redirect: 'follow'
            })
            .then(response => response.text()) // อ่านค่ากลับมาเป็นข้อความก่อน
            .then(text => {
                document.getElementById("loading").style.display = "none";
                try {
                    const data = JSON.parse(text); // ลองแปลงเป็น JSON
                    if (data.status === "found") {
                        document.getElementById("profileSection").style.display = "block";
                        document.getElementById("profileName").innerText = data.name;
                        document.getElementById("profileSchool").innerText = data.school;
                    } else {
                        document.getElementById("registerSection").style.display = "block";
                    }
                } catch(e) {
                    // หาก Google ส่ง Error กลับมาเป็นหน้าเว็บ (ไม่ใช่ JSON) จะแจ้งเตือนตรงนี้
                    alert("Google Apps Script แจ้งเตือน: \n" + text.substring(0, 100));
                    document.getElementById("registerSection").style.display = "block";
                }
            })
            .catch(error => {
                alert("การเชื่อมต่อล้มเหลว: " + error.message);
                document.getElementById("loading").style.display = "none";
            });
        }

        function register() {
            const name = document.getElementById("name").value;
            const school = document.getElementById("school").value;
            const btn = document.getElementById("btnRegister");

            if (!name || !school) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วน");
                return;
            }

            btn.innerText = "กำลังบันทึก...";
            btn.disabled = true;

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: "register", userId: userId, name: name, school: school })
            })
            .then(() => {
                alert("ลงทะเบียนสำเร็จ!");
                document.getElementById("registerSection").style.display = "none";
                document.getElementById("profileSection").style.display = "block";
                document.getElementById("profileName").innerText = name;
                document.getElementById("profileSchool").innerText = school;
            }).catch((error) => {
                alert("เกิดข้อผิดพลาดในการบันทึก: " + error.message);
                btn.innerText = "ลงทะเบียน";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
